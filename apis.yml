apis:
- name: UNTUCKit Storefront Agent Commerce (UCP/MCP) API
  description: >-
    Live MCP endpoint implementing the Universal Commerce Protocol shopping
    service for the UNTUCKit store: catalog search, cart, checkout,
    fulfillment, discounts, and orders, with Shop Pay / Google Pay / card
    payment handlers and a hard buyer-approval rule on payment. Discovered via
    /.well-known/ucp; schema published as OpenRPC at ucp.dev.
  humanURL: https://www.untuckit.com/agents.md
  baseURL: https://www.untuckit.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - MCP
  - UCP
  - Checkout
  properties:
  - type: Documentation
    url: https://www.untuckit.com/agents.md
- name: UNTUCKit Storefront Catalog JSON API
  description: >-
    Unauthenticated read-only Shopify storefront JSON documented in the
    store's agents.md: product JSON at /products/{handle}.json, collection
    product listings at /collections/{handle}/products.json, product search at
    /search?q={query}&type=product, and sitemap.xml for store metadata.
  humanURL: https://www.untuckit.com/agents.md
  baseURL: https://www.untuckit.com
