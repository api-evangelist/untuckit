aid: untuckit
name: UNTUCKit
description: >-
  UNTUCKit is a US apparel brand and omnichannel retailer best known for
  shirts designed to be worn untucked, selling menswear and womenswear through
  untuckit.com and its retail stores. Its Shopify-powered storefront is
  notably agent-ready: the store publishes agents.md and llms.txt operating
  instructions, a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp, a live MCP endpoint at /api/ucp/mcp for catalog search,
  cart, and buyer-approved checkout, OIDC/OAuth discovery for the Shopify
  Customer Account API, and unauthenticated product and collection JSON.
